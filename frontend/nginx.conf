# Serves the React build and proxies the API, so the browser sees a single
# origin (the auth cookie is SameSite=Strict).
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/(api|auth|actuator)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # The backend's per-IP login limits need the real client address
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # AI calls can take a while
    }

    # Hashed build assets never change
    location /static/ {
        expires 1y;
    }

    # Client-side routes fall back to index.html, which is always revalidated
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
