# ── Database ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Server ───────────────────────────────────────────────────
server.port=${PORT:8080}
spring.application.name=cloud-service-recommendation

# ── AI (Google Gemini) ───────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY}

# ── Auth (JWT) ───────────────────────────────────────────────
# JWT_SECRET must be at least 32 bytes. The default below is for local
# development only — always set JWT_SECRET in any deployed environment.
jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-min-32-bytes!!}
jwt.expiration-ms=86400000

# ── Pricing ──────────────────────────────────────────────────
azure.pricing.region=${AZURE_PRICING_REGION:centralindia}

# ── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
