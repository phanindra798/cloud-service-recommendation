# ── Database ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Server ───────────────────────────────────────────────────
server.port=${PORT:8080}
spring.application.name=cloud-service-recommendation

# ── AI (Google Gemini) ───────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY}

# ── Auth (JWT) ───────────────────────────────────────────────
# Required, at least 32 bytes (e.g. `openssl rand -base64 48`). There is no
# default: the app refuses to start without it.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# ── Pricing ──────────────────────────────────────────────────
# The region comes from each request (defaults to US); Azure live prices are
# fetched for that region.

# ── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Observability ────────────────────────────────────────────
# /actuator/health and /actuator/info are public; metrics and prometheus need a JWT.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.recommendation.latency=true

# One JSON object per log line (Elastic Common Schema). MDC values such as
# requestId and user are included automatically. Other values: logstash, gelf.
logging.structured.format.console=${LOG_FORMAT:ecs}
