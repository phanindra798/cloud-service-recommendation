# Test configuration: in-memory H2 instead of PostgreSQL, no real external calls.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.application.name=cloud-service-recommendation

gemini.api.key=test-key
# Unroutable by design: any test that forgets to mock Gemini fails fast into the fallback.
gemini.api.url=http://127.0.0.1:1/gemini

jwt.secret=test-secret-that-is-at-least-32-bytes-long!!
jwt.expiration-ms=3600000

azure.pricing.region=centralindia
azure.pricing.api-url=http://127.0.0.1:1/azure
azure.pricing.warm-cache=false

app.cors.allowed-origins=http://localhost:3000
